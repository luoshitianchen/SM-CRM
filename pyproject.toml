[project]
name = "SM-CRM"
version = "2.0.0"
description = "客户关系管理系统：客户、线索、商机、销售管道与跟进"
requires-python = ">=3.11"

[tool.ruff]
line-length = 200
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
